<head>

</div>

function atualizar(){
var
v=Number(document.getElementById('valor').val
ue);
var
d=Number(document.getElementById('desconto')
.value);
var desc=v*d/100;
var fin=v-desc;
document.getElementById('vDesconto').textCont
ent=desc;
document.getElementById('vFinal').textContent=f
in;

function gerar(){

'+document.getElementById('valor').value+'\nDes

'+document.getElementById('desconto').value+'
por cento\nFinal:
'+document.getElementById('vFinal').textContent;

}
function zap(){gerar();window.open('https://
